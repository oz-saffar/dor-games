server {
    listen 80;
    listen [::]:80;
    
    # Replace with your domain or server IP
    server_name dor-games.yourdomain.com;
    
    # Path to your uploaded files (adjust if needed)
    root /var/www/dor-games;
    index index.html;
    
    # Enable gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    
    # Main location block
    location / {
        # Try to serve file directly, fallback to index.html (for React Router)
        try_files $uri $uri/ /index.html;
    }
    
    # Cache static assets for better performance
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}



